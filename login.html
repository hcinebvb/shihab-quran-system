<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — مدرسة شهاب</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark"><span>ش</span></div>
        <h1>مدرسة شهاب للقرآن الكريم</h1>
        <p>نظام الإدارة المدرسية المتكامل</p>
      </div>
      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label class="form-label">اسم المستخدم</label>
          <input class="form-control" type="text" name="username" required autocomplete="username" placeholder="admin" />
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <input class="form-control" type="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <div class="form-group">
          <label class="form-label">رابط الخادم (API)</label>
          <input class="form-control" type="text" name="apiBase" id="apiBaseInput" placeholder="https://your-api.onrender.com/api" />
        </div>
        <label class="form-check">
          <input type="checkbox" name="remember" id="rememberMe" />
          <span>تذكرني</span>
        </label>
        <button type="submit" class="btn btn-gold">تسجيل الدخول</button>
      </form>
      <div class="login-links">
        <a href="#" id="forgotPassword">استرجاع كلمة المرور</a>
      </div>
      <div style="margin-top:24px;padding:14px;background:var(--bg-tertiary);border-radius:var(--radius-md);font-size:0.75rem;color:var(--text-secondary);">
        <strong>حسابات تجريبية:</strong><br>
        مدير: admin / admin123<br>
        مشرف: supervisor / sup123<br>
        أستاذ: aziz / teacher123
      </div>
    </div>
  </div>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    SHIHAB_UI.initTheme();
    if (SHIHAB_DB.Auth.currentUser()) {
      SHIHAB_DB.ready().finally(() => { window.location.href = "dashboard.html"; });
    }
    const apiFromUrl = new URLSearchParams(window.location.search).get("api");
    if (apiFromUrl) SHIHAB_DB.setApiBase(apiFromUrl);
    const lastUser = localStorage.getItem("shihab_lastUser");
    if (lastUser) document.querySelector('[name="username"]').value = lastUser;
    document.getElementById("apiBaseInput").value = SHIHAB_DB.getApiBase();

    document.getElementById("loginForm").addEventListener("submit", async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const username = fd.get("username");
      const password = fd.get("password");
      const apiBase = String(fd.get("apiBase") || "").trim();
      if (apiBase) SHIHAB_DB.setApiBase(apiBase);
      if (fd.get("remember")) localStorage.setItem("shihab_remember", username);
      else localStorage.removeItem("shihab_remember");
      try {
        const user = await SHIHAB_DB.Auth.login(username, password);
        SHIHAB_DB.Activity.log(`تسجيل دخول: ${user.fullName}`, "system");
        SHIHAB_UI.toast("مرحباً " + user.fullName, "success");
        window.location.href = "dashboard.html";
      } catch {
        SHIHAB_UI.toast("اسم المستخدم أو كلمة المرور غير صحيحة", "error");
      }
    });

    document.getElementById("forgotPassword").addEventListener("click", e => {
      e.preventDefault();
      SHIHAB_UI.showConfirm({
        title: "استرجاع كلمة المرور",
        message: "تواصل مع مدير النظام لاسترجاع كلمة المرور.<br><br>البريد: admin@shihab.dz",
        confirmText: "حسناً",
        cancelText: "إغلاق",
        onConfirm: () => {},
      });
    });
  </script>
</body>
</html>
